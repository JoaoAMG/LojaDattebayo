# ==================================
# 1. Datasource Configuration
# Values are supplied by environment variables.
# ==================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================
# 2. JPA / Hibernate Configuration
# ==================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================================================
# 3. JWT Configuration
# The secret is supplied by an environment variable.
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.access.expiration=14400000
jwt.refresh.short-expiration=28800000
jwt.refresh.long-expiration=604800000


# 5. Email Configuration
# IMPORTANT: Values are supplied by environment variables.
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
# 6. Other Spring Configurations
# =========================================================
spring.security.filter.dispatcher-types=error,request,async,forward

# ==================================
# 7. Transaction Debug Logging
# ==================================
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.Transaction=DEBUG